[mypy]
# Exclude build artifacts and typical virtualenv/dist directories that can
# introduce duplicate module paths during static analysis.
exclude = ^(build|dist|\.venv|venv|\.eggs|\.git)/

# Optional: be explicit about the python version used in CI / development
# python_version = 3.12

# Don't fail on missing imports for 3rd-party optional deps in some CI runs.
# Users can remove or tune this if they want stricter checks.
ignore_missing_imports = True
