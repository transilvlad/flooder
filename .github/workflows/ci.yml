name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.11, 3.12, 3.13]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Show workspace files (debug)
      run: |
        echo "Working directory: $(pwd)"
        echo "List files:"
        dir
        echo "List root patterns:"
        dir | more
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Install package if a build manifest exists; otherwise fall back to requirements or install test tools only.
        if [ -f pyproject.toml ] || [ -f setup.py ]; then
          pip install .
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "No pyproject.toml/setup.py/requirements.txt found; installing test tooling only."
        fi
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        fi
        pip install pytest
        pip install mypy
    - name: Install monitoring extras on Windows
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install .[monitoring]
    - name: Type check
      run: |
        mypy .
    - name: Run tests
      run: |
        set PYTHONPATH=flooder
        pytest -q
