name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest mypy
    - name: Lint
      run: |
        echo "Skipping flake8 lint in release workflow per configuration."
    - name: Type check
      run: |
        mypy .
    - name: Run tests
      run: |
        pytest -q
    - name: Build distributions
      run: |
        pip install build
        python -m build
